<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OntoForge</title>
<style>
@font-face { font-family: Plex; font-weight: 400; src: url(/__video/font/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Plex; font-weight: 600; src: url(/__video/font/ibm-plex-sans-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Plex; font-weight: 700; src: url(/__video/font/ibm-plex-sans-latin-700-normal.woff2) format('woff2'); }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(1200px 700px at 30% 40%, #12384a 0%, #0b2230 55%, #08161f 100%); color: #e8f3f4; font-family: Plex, system-ui, sans-serif; display: grid; place-items: center; overflow: hidden; }
.wrap { display: grid; grid-template-columns: auto 1fr; gap: 56px; align-items: center; max-width: 1180px; padding: 0 60px; opacity: 0; transform: translateY(14px); animation: in .9s .2s ease-out forwards; }
img { width: 300px; height: 300px; image-rendering: pixelated; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
.kick { font-size: 22px; letter-spacing: .18em; text-transform: uppercase; color: #5fd3c6; font-weight: 600; }
h1 { font-size: 104px; margin: 6px 0 10px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
h1 span { color: #2fc0b0; }
p { font-size: 34px; line-height: 1.35; margin: 0; color: #b9d3d6; max-width: 760px; }
.chips { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; opacity: 0; animation: in .8s 1.1s ease-out forwards; }
.chips b { font-weight: 600; font-size: 22px; padding: 8px 16px; border-radius: 999px; border: 1px solid #2c6c70; color: #cfe9ea; background: rgba(47,192,176,.08); }
.chips b i { font-style: normal; color: #5fd3c6; margin-right: 8px; }
@keyframes in { to { opacity: 1; transform: none; } }
</style></head>
<body>
<div class="wrap">
  <img id="k" alt="">
  <div>
    <div class="kick" id="kick"></div>
    <h1>Onto<span>Forge</span></h1>
    <p id="sub"></p>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search)
document.getElementById('kick').textContent = q.get('kick') || ''
document.getElementById('sub').textContent = q.get('sub') || ''
const chips = (q.get('chips') || '').split('|').filter(Boolean)
document.getElementById('chips').innerHTML = chips.map((c, i) => `<b><i>${i + 1}</i>${c.replace(/</g, '&lt;')}</b>`).join('')
const pose = q.get('pose') || 'accueil'
fetch('/krakie/anim/manifest.json').then(r => r.json()).then(m => {
  const d = m[pose] || [300, 300, 300, 300]; let i = 0; const img = document.getElementById('k')
  const tick = () => { img.src = `/krakie/anim/${pose}-${i + 1}.svg`; setTimeout(() => { i = (i + 1) % d.length; tick() }, d[i]) }
  tick()
})
</script>
</body></html>

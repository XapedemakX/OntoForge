server {
  listen 80;
  client_max_body_size 50m;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 300s; proxy_set_header Host $host; }
  # Fichiers statiques : un fichier manquant doit répondre 404 (et non index.html en 200, que le jeu prendrait pour une image).
  location /krakie/ { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location /assets/ { try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}

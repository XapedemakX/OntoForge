# Front local (docker compose). Écoute sur 8080 : l'image nginx sans privilèges (utilisateur non root) ne peut pas ouvrir le port 80.
# Le port publié sur la machine est réglé dans docker-compose.yml (ONTOFORGE_PORT, 8088 par défaut), lié à 127.0.0.1.
server {
  listen 8080;
  server_tokens off;
  client_max_body_size 50m;
  root /usr/share/nginx/html;
  # API : l'adresse du client est transmise telle que nginx la voit (jamais celle fournie par le client) pour la limitation de débit.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 300s;
    # $http_host garde le port (8088) : le contrôle d'origine du backend compare l'en-tête Origin du navigateur à l'en-tête Host (L39-07).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    include /etc/nginx/ontoforge-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  # Fichiers statiques : un fichier manquant doit répondre 404 (et non index.html en 200, que le jeu prendrait pour une image).
  location /krakie/ { try_files $uri =404; add_header Cache-Control "no-cache"; include /etc/nginx/ontoforge-security-headers.conf; }
  location /assets/ { try_files $uri =404; include /etc/nginx/ontoforge-security-headers.conf; }
  location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/ontoforge-security-headers.conf; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/ontoforge-security-headers.conf; }
}

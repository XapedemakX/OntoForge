# En-têtes de sécurité du front local (L39-secu, SEC-12). Inclus dans CHAQUE bloc `location` (nginx n'hérite pas add_header
# d'un niveau à l'autre dès qu'un bloc en déclare un). La politique CSP est la même que celle du serveur (backend/ontoforge/security.py,
# constante CSP) : un test les compare.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Variables d'environnement non secrètes du service Cloud Run (gcloud run deploy --env-vars-file deploy/cloudrun/env.yaml).
# Un fichier évite les pièges de séparateurs (virgules, « ^@^ ») selon le terminal (PowerShell, cmd, bash).
ONTOFORGE_AUTH_ADMINS: "jerem"
# Hôtes joignables par les appels sortants (fournisseur LLM, endpoints SPARQL publics), séparés par des virgules.
ONTOFORGE_EGRESS_ALLOW: "api.anthropic.com,generativelanguage.googleapis.com"
ONTOFORGE_SHACL_SLOTS: "1"
ONTOFORGE_HERMIT_MAX_MB: "768"
# L52 (revue secu) : conteneur de 2 Gio, une instance. Chaque plafond borne un processus fils (espace d'adressage, RLIMIT_AS),
# pas la somme : on garde une seule place OWL RL et des fils de 1 Gio au plus.
ONTOFORGE_OWLRL_SLOTS: "1"
ONTOFORGE_OWLRL_MEMORY_MB: "1024"
# Requêtes et inférence du triplestore local. Mesuré le 24/11 : un fils de requête a besoin d'au moins 640 Mo d'espace d'adressage
# (ouverture de la base RocksDB) ; 1024 Mo suffisent à l'inférence au plafond de 30 000 triplets sources (58 s, sémantique both).
ONTOFORGE_LOCAL_STORE_MEMORY_MB: "1024"

# Variables d'environnement non secrètes du service Cloud Run (gcloud run deploy --env-vars-file deploy/cloudrun/env.yaml).
# Un fichier évite les pièges de séparateurs (virgules, « ^@^ ») selon le terminal (PowerShell, cmd, bash).
ONTOFORGE_AUTH_ADMINS: "jerem"
# Hôtes joignables par les appels sortants (fournisseur LLM, endpoints SPARQL publics), séparés par des virgules.
ONTOFORGE_EGRESS_ALLOW: "api.anthropic.com,generativelanguage.googleapis.com"
ONTOFORGE_SHACL_SLOTS: "1"
ONTOFORGE_HERMIT_MAX_MB: "768"

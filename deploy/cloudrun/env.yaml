# Variables d'environnement non secrètes du service Cloud Run (gcloud run deploy --env-vars-file deploy/cloudrun/env.yaml).
# Un fichier évite les pièges de séparateurs (virgules, « ^@^ ») selon le terminal (PowerShell, cmd, bash).
ONTOFORGE_AUTH_ADMINS: "jerem"
# Hôtes joignables par les appels sortants (fournisseur LLM, endpoints SPARQL publics), séparés par des virgules.
ONTOFORGE_EGRESS_ALLOW: "api.anthropic.com,generativelanguage.googleapis.com"
# L53 (DF-B13, D-L53-02) : conteneur de 2 Gio (2048 Mo), une instance. Chaque plafond borne UN processus fils ; ce qui compte est la somme au pire,
# toutes les places prises en même temps. Valeurs mesurées le 24/11 (détail dans deploy/cloudrun/README.md, « Plafonds et somme au pire » ;
# docs/dev chapitres 16 et 17). Le disque de l'instance est en mémoire (documentation Cloud Run, contrat d'exécution) : le triplestore local
# (/tmp/ontoforge-triplestore) compte donc aussi.
#   serveur au repos (mesuré 121 à 146 Mo, retenu 175)        175
#   SHACL                1 place × 320 Mo                     320   (minimum mesuré : 192 Mo pour 42 000 triplets de données)
#   OWL RL (conformité)  1 place × 256 Mo                     256   (minimum mesuré : 96 Mo pour 7 000 triplets ; à 22 000 triplets le délai tombe avant la mémoire)
#   HermiT               1 place × (tas 192 Mo + JVM ~150)    342   (tas mesuré suffisant : 128 Mo ; JVM seule : ~130 Mo)
#   triplestore, fils    1 place × 640 Mo                     640   (plancher mesuré 608 Mo pour une base de 50 000 triplets, 640 Mo pour 1 000 000 ; 10 essais sur 10 à 640)
#   triplestore, chargement dans le serveur : 1 place × ((50 000 + 20 000) triplets × 1,7 Mo / 1 000 + fichier 5 Mo)   124   (mesuré : +164 Mo pour 100 000, +249 Mo pour 200 000)
#   triplestore, disque (en mémoire)                           64   (ONTOFORGE_LOCAL_STORE_TOTAL_MB)
#   corps de requête reçu avant la prise d'une place (ONTOFORGE_MAX_BODY_MB)   12   (un corps ; plafond des imports : documents de l'assistant 10 Mo)
#   total au pire                                            1933 Mo, marge 115 Mo sous 2048
ONTOFORGE_SHACL_SLOTS: "1"
ONTOFORGE_SHACL_MEMORY_MB: "320"
ONTOFORGE_OWLRL_SLOTS: "1"
ONTOFORGE_OWLRL_MEMORY_MB: "256"
ONTOFORGE_HERMIT_SLOTS: "1"
ONTOFORGE_HERMIT_MAX_MB: "192"
# Une seule famille de places pour les requêtes ET l'inférence du triplestore local, tous projets confondus (503 + Retry-After si pleine).
ONTOFORGE_LOCAL_STORE_SLOTS: "1"
ONTOFORGE_LOCAL_STORE_MEMORY_MB: "640"
# Chargement d'un fichier : analysé et écrit dans le serveur, une place, 50 000 triplets par projet, 5 Mo par fichier.
ONTOFORGE_LOCAL_STORE_LOAD_SLOTS: "1"
ONTOFORGE_LOCAL_STORE_MAX_TRIPLES: "50000"
ONTOFORGE_LOCAL_STORE_MAX_UPLOAD_MB: "5"
# Disque du triplestore (en mémoire sur Cloud Run) : plafond total (413 au-delà, marge de compaction comprise) et purge des bases inactives.
ONTOFORGE_LOCAL_STORE_TOTAL_MB: "64"
ONTOFORGE_LOCAL_STORE_IDLE_MIN: "30"
# Taille maximale d'un corps de requête (défaut 32). Un envoi est reçu en entier AVANT que le gestionnaire prenne une place (503 sinon) : ce plafond borne
# ce que chaque envoi simultané occupe. 12 Mo couvrent le plus gros envoi permis (document de l'assistant : 10 Mo ; imports de schémas : 10 Mo cumulés).
ONTOFORGE_MAX_BODY_MB: "12"

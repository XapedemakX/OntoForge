# Construction de l'image Cloud Run d'OntoForge par Cloud Build (contexte = racine du dépôt).
# Usage (depuis la racine) :
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml --substitutions _IMAGE=<région>-docker.pkg.dev/<projet>/ontoforge/ontoforge:<étiquette>
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/cloudrun/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s

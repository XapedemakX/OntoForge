# OntoForge — oracle des constats attendus sur samples/trap/trap.ttl
# Propriétaire : w3c (L0). Consommateurs : tests L2 (conformance), L3 (moteur de mapping), L4 (générateurs).
#
# Sémantique de l'oracle
#  - `findings` est un ensemble MINIMAL : le moteur doit produire au moins un Finding pour chaque entrée,
#    avec la règle, le sujet et la sévérité indiqués. Des constats supplémentaires sont tolérés
#    (ex. O09 sur chaque propriété fonctionnelle), sauf ceux listés dans `must_not`.
#  - `subject` : IRI complète (préfixe am: = https://w3id.org/ontoforge/automaint#). Pour un construct
#    anonyme (nœud blanc), `subject` est l'IRI nommée à laquelle il se rattache (`anchor`), et `bnode`
#    décrit le construct. Le test compare (rule, subject) ; `bnode` est indicatif.
#  - `severity` ∈ {auto, review, lost} — catalogue corrigé par journal/L0/review-w3c-catalogue.md
#    (K02 et C05 passent en review ; 30 règles ajoutées).
#  - `curiosity` / `neo4j` : `severity` facultatif = sévérité propre à la cible (sinon `severity` commune) ;
#    `recommended` = identifiant d'option (vocabulaire ci-dessous) que le moteur
#    doit marquer `recommended` pour cette cible. `note` est indicatif (non testé).
#
# Vocabulaire d'options proposé (à reprendre tel quel dans mapping/rules, cf. revue §5) :
#   node_type, label, multi_label, flatten_into_leaves, primary_parent_discriminator, secondary_label,
#   merge_into_leaves, merge_types, computed_label, materialize_at_ingest, validation, doc_only,
#   reference_nodes, enum_property, uri_key, node_key, unique_constraint, key_concat, generated_key,
#   materialize_key, property, attach_to_users, duplicate_per_type, list_property, scalar,
#   native_type, string_lexical, per_language_property, string_property, intersection_domain,
#   most_specific_type, relationship, edge_pair, single_direction, undirected_query, self_reverse,
#   var_length_query, materialize_closure, path_query, resolve_named_inverse, reverse_traversal,
#   ignore, merge_relationship_types, keep_node, dereify_relationship, schema_metadata,
#   provenance_property, report, exclude, flag_deprecated, load_closure_offline, external_reference,
#   merge_nodes, same_as_edge, noop_una, rename

version: 1
ontology: samples/trap/trap.ttl
ontology_iri: https://w3id.org/ontoforge/automaint
prefixes:
  am: https://w3id.org/ontoforge/automaint#

conformance:            # oracle L2 (conformance/profiles.py, lint.py)
  owl2_dl: true         # sous réserve de la fermeture d'import PROV-O (signaler l'import non résolu)
  profiles: { EL: false, QL: false, RL: false }
  profile_reasons:
    EL: [ObjectInverseOf (am:Garage), ObjectUnionOf (am:Owner), cardinalités (am:RepairOrder), InverseFunctional (am:hasRepairOrder)]
    QL: [owl:hasKey (am:Vehicle), owl:propertyChainAxiom (am:vehicleBrand), TransitiveProperty (am:isComponentOf), cardinalités]
    RL: [ObjectSomeValuesFrom en super-classe (am:ElectricVehicle), ObjectUnionOf en super-classe (am:ServiceProvider), owl:minQualifiedCardinality 4 (am:Car), ReflexiveProperty (am:interchangeableWith), DataRange à facettes (am:ModelYear)]
  non_simple_properties: [am:isComponentOf, am:vehicleBrand]
  consistent: true      # sans le bug owlrl ci-dessous
  known_tool_issues:
    - tool: owlrl 7.1.2
      rule: prp-key
      issue: "OWLRL.py boucle `range(0, len(pis) - 1)` : la dernière propriété de clé est ignorée ; avec owl:hasKey (am:vin) tous les am:Vehicle deviennent owl:sameAs → fausses violations de NegativePropertyAssertion."
      workaround: "retirer les axiomes owl:hasKey du graphe avant DeductiveClosure et implémenter prp-key soi-même (ou HermiT)."
  # Codes proposés (lint.py, codes stables) : W3C-001..007 = règles W01..W07 de la revue L0 §3.2 ;
  # BP-001 label fr/en manquant, BP-002 versionIRI absente, BP-003 entité dépréciée, BP-004 import non résolu,
  # BP-005 nom hors convention, BP-006 collision de noms après normalisation.
  issues:               # ensemble attendu (L2 A2) : (code, subject, severity) ; aucune issue `error`
    - { code: BP-004, subject: "http://www.w3.org/ns/prov-o", severity: warning }
    - { code: BP-003, subject: am:ServiceBooklet, severity: info }
    - { code: BP-005, subject: am:dtc_code, severity: warning }
    - { code: BP-006, subject: am:warranty, related: am:Warranty, severity: warning }
  issues_must_not:
    - { severity: error, why: "trap.ttl est OWL 2 DL : toute issue error (W3C-001..006) est un faux positif" }
    - { code: W3C-003, subject: am:Car, why: "hasPart est simple (aucune sous-propriété/inverse transitif) : min 4 Wheel est légal" }

shacl:                  # oracle L2 A4 (shacl/validate.py, inference="none") : ensemble EXACT
  shapes: samples/trap/trap-shapes.ttl
  data: samples/trap/trap-data.ttl
  inference: none
  conforms: false
  violations:
    - { focusNode: am:veh_bad_vin,   path: am:vin,                    constraint: sh:PatternConstraintComponent }
    - { focusNode: am:veh_no_model,  path: am:ofModel,                constraint: sh:MinCountConstraintComponent }
    - { focusNode: am:veh_bad_fuel,  path: am:usesFuel,               constraint: sh:InConstraintComponent }
    - { focusNode: am:veh_bad_owner, path: am:hasOwner,               constraint: sh:OrConstraintComponent }
    - { focusNode: am:ro_bad_dates,  path: am:openedAt,               constraint: sh:LessThanConstraintComponent }
    - { focusNode: am:ro_no_op,      path: am:includesOperation,      constraint: sh:QualifiedMinCountConstraintComponent }
    - { focusNode: am:garage_empty,  path: "[sh:inversePath am:worksAt]", constraint: sh:MinCountConstraintComponent }
    - { focusNode: am:reading_extra, path: am:note,                   constraint: sh:ClosedConstraintComponent }

shacl_interplay:        # cas complémentaire (piège D11 × sh:closed)
  - command: "pyshacl -s samples/trap/trap-shapes.ttl -i rdfs samples/trap/trap.ttl"   # inference=rdfs
    conforms: false
    violations: 1       # sh:closed × sous-propriété entaillée (D11) sur le relevé anonyme de am:veh_001

